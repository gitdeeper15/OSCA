[metadata]
name = osca-engine
version = 1.0.0
description = OSCA: Origin, Semantic, and Consequence Authority — A Multi-Tier Authorization Architecture for Autonomous AI Agents
long_description = file: README.md
long_description_content_type = text/markdown
author = Samir Baladi
author_email = gitdeeper@gmail.com
license = MIT
license_files = LICENSE
project_urls =
    Homepage = https://osca-ai.netlify.app
    Source = https://github.com/gitdeeper15/OSCA
    PyPI = https://pypi.org/project/osca-engine
    Zenodo = https://doi.org/10.5281/zenodo.23851837
    OSF = https://doi.org/10.17605/OSF.IO/5EQC9
    Figshare = https://doi.org/10.6084/m9.figshare.34884411
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Security
    Topic :: Software Development :: Quality Assurance

[options]
packages = find:
install_requires =
    pydantic>=2.0.0
python_requires = >=3.11

[options.packages.find]
exclude =
    tests
    tests.*
    docs
    docs.*

[options.extras_require]
dev =
    pytest>=8.0.0
    pytest-cov>=4.1.0
    black>=24.0.0
    flake8>=7.0.0
    mypy>=1.8.0
    isort>=5.13.0
    pre-commit>=3.6.0

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,venv,.venv

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

[coverage:run]
source = core,authority,governance,security
omit = */tests/*,*/test_*,*/.git/*,*/__pycache__/*,.venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
show_missing = True
skip_covered = True
